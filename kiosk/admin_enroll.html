<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Face Enrollment</title>
    <script defer src="js/face-api.min.js"></script>
    <style>
        :root {
            --blue: #1e0178;
            --red: #db261f;
            --white: #f9f9f9;
            --bg: #eef1f6;
            --text: #222;
            --radius: 24px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            font-size: 32px;
            font-weight: bold;
            color: var(--blue);
            margin-bottom: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        #video-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            border-radius: 50%;
            overflow: hidden;
            background: #000;
            border: 5px solid var(--blue);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        #video-container.registered {
            border-color: var(--red) !important;
            box-shadow: 0 0 20px rgba(219, 38, 31, 0.4);
        }

        #video-container.success {
            border-color: #28a745 !important;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.4);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: var(--blue);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            font-weight: bold;
        }

        .nav-links {
            margin-top: 20px;
        }

        .nav-links a {
            color: var(--blue);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">Face Enrollment</div>

    <div class="container">
        <div class="input-group">
            <label for="empSelect">Select Employee:</label>
            <select id="empSelect" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px;">
                <option value="">Loading employees...</option>
            </select>
        </div>

        <div id="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <button id="enrollBtn" disabled>Enroll Face</button>
        <div id="status" class="status">Loading Models...</div>

        <div class="nav-links">
            <a href="kiosk.html">← Back to Kiosk</a>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const enrollBtn = document.getElementById('enrollBtn');
        const status = document.getElementById('status');
        const empSelect = document.getElementById('empSelect');
        const videoContainer = document.getElementById('video-container');

        const MODEL_URL = '../AI-ML-Test-Bench/models/';
        let faceMatcher = null;
        let employees = [];

        async function init() {
            try {
                const CDN_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                try {
                    await Promise.all([
                        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL)
                    ]);
                } catch (e) {
                    await Promise.all([
                        faceapi.nets.tinyFaceDetector.loadFromUri(CDN_MODEL_URL),
                        faceapi.nets.faceLandmark68Net.loadFromUri(CDN_MODEL_URL),
                        faceapi.nets.faceRecognitionNet.loadFromUri(CDN_MODEL_URL),
                        faceapi.nets.ssdMobilenetv1.loadFromUri(CDN_MODEL_URL)
                    ]);
                }
                status.textContent = "Models Loaded. Please allow camera access.";
                loadEmployees();
                startVideo();
            } catch (err) {
                status.textContent = "Error loading models: " + err.message;
            }
        }

        async function loadEmployees() {
            try {
                const res = await fetch('../AI-ML-Test-Bench/backend/api.php?action=get_employees');
                employees = await res.json();
                
                empSelect.innerHTML = '<option value="">-- Select Employee --</option>' + 
                    employees.map(e => `<option value="${e.id}">${e.full_name} (${e.employee_id})</option>`).join('');
                
                loadEnrolledFaces();
            } catch (err) {
                empSelect.innerHTML = '<option value="">Error loading employees</option>';
            }
        }

        async function loadEnrolledFaces() {
            try {
                const res = await fetch('../AI-ML-Test-Bench/backend/api.php?action=get_enrolled_faces');
                const result = await res.json();
                if (result.success && result.faces.length > 0) {
                    const labeledDescriptors = result.faces.map(face => {
                        const descriptor = new Float32Array(JSON.parse(face.face_descriptor));
                        return new faceapi.LabeledFaceDescriptors(face.full_name, [descriptor]);
                    });
                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
                }
            } catch (err) {
                console.error("Error loading enrolled faces:", err);
            }
        }

        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
                .then(stream => {
                    video.srcObject = stream;
                    status.textContent = "Camera active. Position your face.";
                    enrollBtn.disabled = false;
                })
                .catch(err => {
                    status.textContent = "Camera error: " + err.message;
                });
        }

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);

            setInterval(async () => {
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptors();
                
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
                
                if (detections.length > 0) {
                    faceapi.draw.drawFaceLandmarks(overlay, resizedDetections);
                    videoContainer.classList.remove('registered', 'success');

                    if (faceMatcher) {
                        const results = detections.map(d => faceMatcher.findBestMatch(d.descriptor));
                        const match = results.find(r => r.label !== 'unknown');
                        
                        if (match) {
                            const selectedId = empSelect.value;
                            const selectedEmp = employees.find(e => e.id == selectedId);
                            
                            if (selectedEmp && match.label.toLowerCase() === selectedEmp.full_name.toLowerCase()) {
                                status.textContent = `Confirmed: This is ${match.label}`;
                                videoContainer.classList.add('success');
                            } else {
                                status.textContent = `Already Registered: ${match.label}`;
                                videoContainer.classList.add('registered');
                            }
                        } else {
                            status.textContent = "Face detected. Ready to enroll.";
                            videoContainer.classList.add('success');
                        }
                    } else {
                        status.textContent = "Face detected. Ready to enroll.";
                        videoContainer.classList.add('success');
                    }
                } else {
                    status.textContent = "Camera active. Position your face.";
                    videoContainer.classList.remove('registered', 'success');
                }
            }, 500);
        });

        enrollBtn.addEventListener('click', async () => {
            const employeeId = empSelect.value;
            if (!employeeId) {
                alert("Please select an employee");
                return;
            }

            status.textContent = "Capturing face data...";
            enrollBtn.disabled = true;

            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options())
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (detection) {
                const descriptor = Array.from(detection.descriptor);
                
                try {
                    const response = await fetch('../AI-ML-Test-Bench/backend/api.php?action=save_face_descriptor', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            id: employeeId, 
                            descriptor: descriptor 
                        })
                    });
                    
                    const result = await response.json();
                    if (result.success) {
                        status.textContent = "Successfully enrolled!";
                        loadEnrolledFaces();
                        empSelect.value = '';
                    } else {
                        status.textContent = "Enrollment error: " + result.message;
                    }
                } catch (err) {
                    status.textContent = "Network error occurred.";
                }
            } else {
                status.textContent = "Face not detected. Try again.";
            }
            enrollBtn.disabled = false;
        });

        init();
    </script>
</body>
</html>
