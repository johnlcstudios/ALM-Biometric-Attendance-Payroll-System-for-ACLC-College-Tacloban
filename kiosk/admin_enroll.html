<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Face Enrollment</title>
    <script defer src="js/face-api.min.js"></script>
    <style>
        :root {
            --blue: #1e0178;
            --red: #db261f;
            --white: #f9f9f9;
            --bg: #eef1f6;
            --text: #222;
            --radius: 24px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            font-size: 32px;
            font-weight: bold;
            color: var(--blue);
            margin-bottom: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        #video-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            border-radius: 50%;
            overflow: hidden;
            background: #000;
            border: 5px solid var(--blue);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        #video-container.registered {
            border-color: var(--red) !important;
            box-shadow: 0 0 20px rgba(219, 38, 31, 0.4);
        }

        #video-container.success {
            border-color: #28a745 !important;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.4);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: var(--blue);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            font-weight: bold;
        }

        .nav-links {
            margin-top: 20px;
        }

        .nav-links a {
            color: var(--blue);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">Face Enrollment</div>

    <div class="container">
        <div class="input-group">
            <label for="empName">Employee Full Name:</label>
            <input type="text" id="empName" placeholder="e.g. John Doe">
        </div>

        <div id="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <button id="enrollBtn" disabled>Enroll Face</button>
        <div id="status" class="status">Loading Models...</div>

        <div class="nav-links">
            <a href="kiosk.html">← Back to Kiosk</a>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const enrollBtn = document.getElementById('enrollBtn');
        const status = document.getElementById('status');
        const empNameInput = document.getElementById('empName');
        const videoContainer = document.getElementById('video-container');

        const MODEL_URL = 'models/';
        let faceMatcher = null;

        async function init() {
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL)
                ]);
                status.textContent = "Models Loaded. Please allow camera access.";
                loadEnrolledFaces();
                startVideo();
            } catch (err) {
                status.textContent = "Error loading models: " + err.message;
            }
        }

        function loadEnrolledFaces() {
            const enrolledData = JSON.parse(localStorage.getItem('enrolledFaces') || '[]');
            if (enrolledData.length > 0) {
                const labeledDescriptors = enrolledData.map(data => {
                    const descriptors = data.descriptors.map(d => new Float32Array(d));
                    return new faceapi.LabeledFaceDescriptors(data.label, descriptors);
                });
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
            }
        }

        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(stream => {
                    video.srcObject = stream;
                    status.textContent = "Camera active. Position your face.";
                    enrollBtn.disabled = false;
                })
                .catch(err => {
                    status.textContent = "Camera error: " + err.message;
                });
        }

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);

            setInterval(async () => {
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptors();
                
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
                faceapi.draw.drawFaceLandmarks(overlay, resizedDetections);

                videoContainer.classList.remove('registered', 'success');

                if (detections.length > 0) {
                    if (faceMatcher) {
                        const results = detections.map(d => faceMatcher.findBestMatch(d.descriptor));
                        const isAlreadyRegistered = results.some(r => r.label !== 'unknown');
                        
                        if (isAlreadyRegistered) {
                            const match = results.find(r => r.label !== 'unknown');
                            const enteredName = empNameInput.value.trim();
                            
                            if (enteredName && match.label.toLowerCase() === enteredName.toLowerCase()) {
                                status.textContent = `Confirmed: This is ${match.label}`;
                                videoContainer.classList.remove('registered');
                                videoContainer.classList.add('success');
                            } else {
                                status.textContent = `Already Registered: ${match.label}`;
                                videoContainer.classList.add('registered');
                            }
                        } else {
                            status.textContent = "Face detected. Ready to enroll.";
                            videoContainer.classList.add('success');
                        }
                    } else {
                        status.textContent = "Face detected. Ready to enroll.";
                        videoContainer.classList.add('success');
                    }
                } else {
                    status.textContent = "Camera active. Position your face.";
                }
            }, 200);
        });

        enrollBtn.addEventListener('click', async () => {
            const name = empNameInput.value.trim();
            if (!name) {
                alert("Please enter employee name");
                return;
            }

            status.textContent = "Capturing face data...";
            enrollBtn.disabled = true;

            const detection = await faceapi.detectSingleFace(video, new faceapi.SsdMobilenetv1Options())
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (detection) {
                const descriptor = Array.from(detection.descriptor);
                saveEnrollment(name, descriptor);
                loadEnrolledFaces(); // Refresh the matcher with the new face
                status.textContent = `Successfully enrolled ${name}!`;
                empNameInput.value = '';
            } else {
                status.textContent = "Face not detected. Try again.";
            }
            enrollBtn.disabled = false;
        });

        function saveEnrollment(label, descriptor) {
            let enrolled = JSON.parse(localStorage.getItem('enrolledFaces') || '[]');
            
            // Check if label already exists
            const index = enrolled.findIndex(e => e.label === label);
            if (index !== -1) {
                enrolled[index].descriptors.push(descriptor);
            } else {
                enrolled.push({
                    label: label,
                    descriptors: [descriptor]
                });
            }
            
            localStorage.setItem('enrolledFaces', JSON.stringify(enrolled));
        }

        init();
    </script>
</body>
</html>
