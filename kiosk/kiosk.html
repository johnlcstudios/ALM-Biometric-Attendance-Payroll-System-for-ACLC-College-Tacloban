<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk System - FaceID</title>
    <script defer src="js/face-api.min.js"></script>
    <style>
        :root {
            --blue: #1e0178;
            --red: #db261f;
            --white: #f9f9f9;
            --bg: #eef1f6;
            --text: #222;
            --radius: 24px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        /* HEADER */
        .header {
            text-align: center;
            font-size: clamp(24px, 4vw, 40px);
            font-weight: bold;
            color: var(--blue);
            padding: 15px;
        }

        /* LAYOUT */
        .container {
            display: flex;
            flex-wrap: wrap;
            min-height: 90vh;
        }

        /* LEFT PANEL */
        .left {
            flex: 1 1 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .photo {
            width: clamp(220px, 35vw, 360px);
            height: clamp(220px, 35vw, 360px);
            border-radius: 50%;
            background: #000;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid var(--blue);
        }

        .photo video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .status-badge {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }

        .status-scanning { background: #ffd700; color: #000; }
        .status-verified { background: #28a745; color: #fff; }
        .status-error { background: #dc3545; color: #fff; }

        /* RIGHT PANEL */
        .right {
            flex: 1 1 400px;
            background: var(--blue);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* CLOCK */
        .clock {
            font-size: clamp(32px, 5vw, 60px);
            font-weight: bold;
        }

        .date {
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* CARD */
        .card {
            background: var(--white);
            color: var(--text);
            border-radius: var(--radius);
            padding: 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        /* TITLE */
        .title {
            background: var(--blue);
            color: white;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* NAME */
        .name {
            margin-bottom: 20px;
        }

        .name strong {
            font-size: 18px;
        }

        /* STATS */
        .stats {
            display: flex;
            gap: 10px;
        }

        .stat {
            flex: 1;
            background: #f0f2f8;
            padding: 15px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .stat:hover {
            transform: translateY(-3px);
        }

        .stat h4 {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat p {
            font-size: 26px;
            font-weight: bold;
            color: var(--blue);
        }

        /* BUTTONS */
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-danger {
            background: var(--red);
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        /* FOOTER */
        .footer {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .stats {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="header">KIOSK SYSTEM</div>

    <div class="container">

        <!-- LEFT -->
        <div class="left">
            <div class="photo" id="photoContainer">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="overlay"></canvas>
                <div id="statusBadge" class="status-badge status-scanning">Loading Models...</div>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="right">

            <div class="clock" id="clock"></div>
            <div class="date" id="date"></div>

            <div class="card">

                <div class="title">EMPLOYEE SUMMARY</div>

                <div class="name">
                    <strong id="empName">Waiting for Scan...</strong><br>
                    <span id="empRole">---</span>
                </div>

                <div class="stats">
                    <div class="stat">
                        <h4>Attendances</h4>
                        <p id="att">00</p>
                    </div>
                    <div class="stat">
                        <h4>Absences</h4>
                        <p id="abs">00</p>
                    </div>
                    <div class="stat">
                        <h4>Loans</h4>
                        <p id="loan">00</p>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn-primary" onclick="timeIn()">Time In</button>
                    <button class="btn-danger" onclick="timeOut()">Time Out</button>
                </div>

            </div>

            <div class="footer">
                Developed By: BSIT-3A (2027) | <a href="admin_enroll.html" style="color: white; text-decoration: none; opacity: 0.8;">Admin Enroll</a>
            </div>

        </div>

    </div>

    <script>
        /* STATE */
        let state = {
            employee: null,
            modelsLoaded: false,
            faceMatcher: null,
            isScanning: true
        };

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const statusBadge = document.getElementById('statusBadge');

        // Path to models (using local folder)
        const MODEL_URL = 'models/';

        /* LOAD MODELS */
        async function loadModels() {
            try {
                statusBadge.textContent = "Loading Face Models...";
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL)
                ]);
                state.modelsLoaded = true;
                statusBadge.textContent = "Models Ready";
                startVideo();
                loadEnrolledFaces();
            } catch (err) {
                console.error("Error loading models:", err);
                statusBadge.textContent = "Error Loading Models";
                statusBadge.className = "status-badge status-error";
            }
        }

        /* START VIDEO */
        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(stream => {
                    video.srcObject = stream;
                })
                .catch(err => {
                    console.error("Error starting video:", err);
                    statusBadge.textContent = "Camera Access Denied";
                    statusBadge.className = "status-badge status-error";
                });
        }

        /* LOAD ENROLLED FACES */
        function loadEnrolledFaces() {
            const enrolledData = JSON.parse(localStorage.getItem('enrolledFaces') || '[]');
            if (enrolledData.length > 0) {
                const labeledDescriptors = enrolledData.map(data => {
                    const descriptors = data.descriptors.map(d => new Float32Array(d));
                    return new faceapi.LabeledFaceDescriptors(data.label, descriptors);
                });
                state.faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
            }
        }

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);

            setInterval(async () => {
                if (!state.modelsLoaded || !state.isScanning) return;

                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptors();

                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
                faceapi.draw.drawFaceLandmarks(overlay, resizedDetections);

                if (detections.length > 0 && state.faceMatcher) {
                    const results = resizedDetections.map(d => state.faceMatcher.findBestMatch(d.descriptor));
                    
                    results.forEach((result, i) => {
                        const { label, distance } = result;
                        if (label !== 'unknown') {
                            statusBadge.textContent = `Verified: ${label}`;
                            statusBadge.className = "status-badge status-verified";
                            
                            // Load employee if not already loaded
                            if (!state.employee || state.employee.name !== label) {
                                loadEmployeeByName(label);
                            }
                        } else {
                            statusBadge.textContent = "Unknown Face";
                            statusBadge.className = "status-badge status-scanning";
                        }

                        const box = resizedDetections[i].detection.box;
                        const drawBox = new faceapi.draw.DrawBox(box, { label: result.toString() });
                        drawBox.draw(overlay);
                    });
                } else if (detections.length > 0) {
                    statusBadge.textContent = "Face Detected (Not Enrolled)";
                    statusBadge.className = "status-badge status-scanning";
                } else {
                    statusBadge.textContent = "Scanning...";
                    statusBadge.className = "status-badge status-scanning";
                }
            }, 500);
        });

        /* CLOCK + DATE */
        function updateDateTime() {
            const now = new Date();

            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            document.getElementById("clock").textContent = time;
            document.getElementById("date").textContent = date;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        /* RENDER */
        function render() {
            if (!state.employee) return;

            document.getElementById("empName").textContent = state.employee.name;
            document.getElementById("empRole").textContent = state.employee.role;
            document.getElementById("att").textContent = state.employee.attendance;
            document.getElementById("abs").textContent = state.employee.absences;
            document.getElementById("loan").textContent = state.employee.loans;
        }

        /* API (SIMULATED) */
        async function fetchEmployeeByName(name) {
            // Simulated database lookup
            const employees = {
                "Arianne Smith": { name: "Arianne Smith", role: "School Dean", attendance: 12, absences: 2, loans: 1 },
                "John Doe": { name: "John Doe", role: "Instructor", attendance: 10, absences: 1, loans: 0 }
            };
            return employees[name] || { name, role: "Employee", attendance: 0, absences: 0, loans: 0 };
        }

        /* LOAD EMPLOYEE */
        async function loadEmployeeByName(name) {
            state.employee = await fetchEmployeeByName(name);
            render();
        }

        /* ACTIONS */
        function timeIn() {
            if (!state.employee) return alert("Please verify your face first");
            alert(`Time In recorded for ${state.employee.name}`);
        }

        function timeOut() {
            if (!state.employee) return alert("Please verify your face first");
            alert(`Time Out recorded for ${state.employee.name}`);
        }

        // Initialize
        loadModels();

    </script>

</body>

</html>
