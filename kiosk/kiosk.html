<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk System - FaceID</title>
    <script defer src="js/face-api.min.js"></script>
    <style>
        :root {
            --blue: #1e0178;
            --red: #db261f;
            --white: #f9f9f9;
            --bg: #eef1f6;
            --text: #222;
            --radius: 24px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        /* HEADER */
        .header {
            text-align: center;
            font-size: clamp(24px, 4vw, 40px);
            font-weight: bold;
            color: var(--blue);
            padding: 15px;
        }

        /* LAYOUT */
        .container {
            display: flex;
            flex-wrap: wrap;
            min-height: 90vh;
        }

        /* LEFT PANEL */
        .left {
            flex: 1 1 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .photo {
            width: clamp(220px, 35vw, 360px);
            height: clamp(220px, 35vw, 360px);
            border-radius: 50%;
            background: #000;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid var(--blue);
        }

        .photo video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .status-badge {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }

        .status-scanning { background: #ffd700; color: #000; }
        .status-verified { background: #28a745; color: #fff; }
        .status-error { background: #dc3545; color: #fff; }

        /* RIGHT PANEL */
        .right {
            flex: 1 1 400px;
            background: var(--blue);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* CLOCK */
        .clock {
            font-size: clamp(32px, 5vw, 60px);
            font-weight: bold;
        }

        .date {
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* CARD */
        .card {
            background: var(--white);
            color: var(--text);
            border-radius: var(--radius);
            padding: 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        /* TITLE */
        .title {
            background: var(--blue);
            color: white;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* NAME */
        .name {
            margin-bottom: 20px;
        }

        .name strong {
            font-size: 18px;
        }

        /* STATS */
        .stats {
            display: flex;
            gap: 10px;
        }

        .stat {
            flex: 1;
            background: #f0f2f8;
            padding: 15px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .stat:hover {
            transform: translateY(-3px);
        }

        .stat h4 {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat p {
            font-size: 26px;
            font-weight: bold;
            color: var(--blue);
        }

        /* BUTTONS */
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-danger {
            background: var(--red);
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        /* FOOTER */
        .footer {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .stats {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="header">KIOSK SYSTEM</div>

    <div class="container">

        <!-- LEFT -->
        <div class="left">
            <div class="photo" id="photoContainer">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="overlay"></canvas>
                <div id="statusBadge" class="status-badge status-scanning">Loading Models...</div>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="right">

            <div class="clock" id="clock"></div>
            <div class="date" id="date"></div>

            <div class="card">

                <div class="title">EMPLOYEE SUMMARY</div>

                <div class="name">
                    <strong id="empName">Waiting for Scan...</strong><br>
                    <span id="empRole">---</span>
                </div>

                <div class="stats">
                    <div class="stat">
                        <h4>Attendances</h4>
                        <p id="att">00</p>
                    </div>
                    <div class="stat">
                        <h4>Absences</h4>
                        <p id="abs">00</p>
                    </div>
                    <div class="stat">
                        <h4>Loans</h4>
                        <p id="loan">00</p>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn-primary" onclick="timeIn()">Time In</button>
                    <button class="btn-danger" onclick="timeOut()">Time Out</button>
                </div>

            </div>

            <div class="footer">
                Developed By: BSIT-3A (2027) | <a href="admin_enroll.html" style="color: white; text-decoration: none; opacity: 0.8;">Admin Enroll</a>
            </div>

        </div>

    </div>

    <script>
        /* STATE */
        let state = {
            employee: null,
            modelsLoaded: false,
            faceMatcher: null,
            isScanning: true
        };

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const statusBadge = document.getElementById('statusBadge');

        // Path to models (using local folder)
        const MODEL_URL = 'models/';

        /* LOAD MODELS */
        async function loadModels() {
            try {
                statusBadge.textContent = "Loading Face Models...";
                // Use absolute path or relative path to models
                const MODEL_URL = '../AI-ML-Test-Bench/models/'; 
                // Fallback to CDN if local models fail
                const CDN_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                
                try {
                    await Promise.all([
                        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL)
                    ]);
                } catch (e) {
                    console.warn("Local models failed, falling back to CDN...");
                    await Promise.all([
                        faceapi.nets.tinyFaceDetector.loadFromUri(CDN_MODEL_URL),
                        faceapi.nets.faceLandmark68Net.loadFromUri(CDN_MODEL_URL),
                        faceapi.nets.faceRecognitionNet.loadFromUri(CDN_MODEL_URL),
                        faceapi.nets.ssdMobilenetv1.loadFromUri(CDN_MODEL_URL)
                    ]);
                }
                
                state.modelsLoaded = true;
                statusBadge.textContent = "Models Ready";
                startVideo();
            } catch (err) {
                console.error("Error loading models:", err);
                statusBadge.textContent = "Error Loading Models";
                statusBadge.className = "status-badge status-error";
            }
        }

        /* START VIDEO */
        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
                .then(stream => {
                    video.srcObject = stream;
                })
                .catch(err => {
                    console.error("Error starting video:", err);
                    statusBadge.textContent = "Camera Access Denied";
                    statusBadge.className = "status-badge status-error";
                });
        }

        let lastScanTime = 0;
        const SCAN_COOLDOWN = 3000; // 3 seconds between scans

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);

            setInterval(async () => {
                if (!state.modelsLoaded || !state.isScanning) return;
                
                const now = Date.now();
                if (now - lastScanTime < SCAN_COOLDOWN) return;

                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptors();

                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
                
                if (detections.length > 0) {
                    faceapi.draw.drawFaceLandmarks(overlay, resizedDetections);
                    
                    // We only scan the first face detected for kiosk mode
                    const descriptor = Array.from(detections[0].descriptor);
                    
                    statusBadge.textContent = "Verifying...";
                    statusBadge.className = "status-badge status-scanning";
                    
                    try {
                        const response = await fetch('../AI-ML-Test-Bench/backend/api.php?action=kiosk_scan', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                company_id: 1, // Default or fetch from settings
                                descriptor: descriptor 
                            })
                        });
                        
                        const result = await response.json();
                        lastScanTime = Date.now();

                        if (result.success) {
                            statusBadge.textContent = `Verified: ${result.name} (${result.match_percentage}%)`;
                            statusBadge.className = "status-badge status-verified";
                            
                            state.employee = {
                                name: result.name,
                                role: result.position,
                                attendance: result.attendance_count,
                                absences: result.absent_count,
                                loans: 0 // Fetch loans if needed
                            };
                            render();
                            
                            // Success Sound or visual feedback
                            document.querySelector('.kiosk-card').classList.add('success-flash');
                            setTimeout(() => document.querySelector('.kiosk-card').classList.remove('success-flash'), 1000);
                            
                        } else {
                            statusBadge.textContent = result.message || "No Match Found";
                            statusBadge.className = "status-badge status-error";
                        }
                    } catch (err) {
                        console.error("Scan error:", err);
                        statusBadge.textContent = "Network Error";
                        statusBadge.className = "status-badge status-error";
                    }
                } else {
                    statusBadge.textContent = "Scanning...";
                    statusBadge.className = "status-badge status-scanning";
                }
            }, 1000);
        });

        /* CLOCK + DATE */
        function updateDateTime() {
            const now = new Date();

            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            document.getElementById("clock").textContent = time;
            document.getElementById("date").textContent = date;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        /* RENDER */
        function render() {
            if (!state.employee) return;

            document.getElementById("empName").textContent = state.employee.name;
            document.getElementById("empRole").textContent = state.employee.role;
            document.getElementById("att").textContent = state.employee.attendance;
            document.getElementById("abs").textContent = state.employee.absences;
            document.getElementById("loan").textContent = state.employee.loans;
        }

        // Initialize
        loadModels();

    </script>

</body>

</html>
