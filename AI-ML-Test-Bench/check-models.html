<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face API Models - Setup Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #1e0178;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .check-item {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #ccc;
            background: #f9f9f9;
        }
        
        .check-item.success {
            border-left-color: #27ae60;
            background: #e8f8f0;
        }
        
        .check-item.error {
            border-left-color: #e74c3c;
            background: #fdf0ef;
        }
        
        .check-item.warning {
            border-left-color: #f39c12;
            background: #fef9e7;
        }
        
        .check-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .check-detail {
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }
        
        .icon {
            display: inline-block;
            width: 24px;
            margin-right: 8px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin: 10px 0;
            overflow-x: auto;
        }
        
        .summary {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
        }
        
        .summary.success {
            background: #27ae60;
            color: white;
        }
        
        .summary.error {
            background: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Face API Models Setup Checker</h1>
        <p class="subtitle">This tool verifies that your face recognition system is properly configured.</p>
        
        <div id="checks"></div>
        
        <div id="summary"></div>
        
        <button onclick="location.reload()">🔄 Re-check</button>
        <button onclick="location.href='kiosk.php'">🚀 Go to Kiosk</button>
    </div>
    
    <script>
        const checksDiv = document.getElementById('checks');
        const summaryDiv = document.getElementById('summary');
        let allPassed = true;
        
        function addCheck(title, detail, status) {
            const div = document.createElement('div');
            div.className = `check-item ${status}`;
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️'
            };
            
            div.innerHTML = `
                <div class="check-title"><span class="icon">${icons[status]}</span>${title}</div>
                <div class="check-detail">${detail}</div>
            `;
            checksDiv.appendChild(div);
            
            if (status === 'error') allPassed = false;
        }
        
        async function runChecks() {
            // Check 1: Models directory exists
            try {
                const response = await fetch('models/.htaccess', { method: 'HEAD' });
                if (response.ok || response.status === 404) {
                    addCheck(
                        'Models Directory Accessible',
                        'The models directory can be accessed by the web server.',
                        'success'
                    );
                } else {
                    addCheck(
                        'Models Directory Access Issue',
                        `Server returned status: ${response.status}. Check file permissions.`,
                        'warning'
                    );
                }
            } catch (err) {
                addCheck(
                    'Models Directory Access Issue',
                    `Cannot access models directory: ${err.message}`,
                    'error'
                );
            }
            
            // Check 2: Model files exist
            const requiredFiles = [
                'tiny_face_detector_model-weights_manifest.json',
                'tiny_face_detector_model-shard1',
                'ssd_mobilenetv1_model-weights_manifest.json',
                'ssd_mobilenetv1_model-shard1',
                'ssd_mobilenetv1_model-shard2',
                'face_landmark_68_model-weights_manifest.json',
                'face_landmark_68_model-shard1',
                'face_recognition_model-weights_manifest.json',
                'face_recognition_model-shard1',
                'face_recognition_model-shard2'
            ];
            
            let missingFiles = [];
            for (const file of requiredFiles) {
                try {
                    const response = await fetch(`models/${file}`, { method: 'HEAD' });
                    if (!response.ok) {
                        missingFiles.push(file);
                    }
                } catch {
                    missingFiles.push(file);
                }
            }
            
            if (missingFiles.length === 0) {
                addCheck(
                    'All Model Files Present',
                    `Found all ${requiredFiles.length} required model files.`,
                    'success'
                );
            } else {
                addCheck(
                    'Missing Model Files',
                    `Missing ${missingFiles.length} file(s):<br><code>${missingFiles.join(', ')}</code><br><br>
                     <strong>Fix:</strong> Copy the missing files from the original system's models/ folder.`,
                    'error'
                );
            }
            
            // Check 3: Face-api.js library
            try {
                const response = await fetch('js/face-api.min.js', { method: 'HEAD' });
                if (response.ok) {
                    addCheck(
                        'Face-API.js Library Found',
                        'The face-api.min.js library is accessible.',
                        'success'
                    );
                } else {
                    addCheck(
                        'Face-API.js Library Missing',
                        'Cannot find js/face-api.min.js',
                        'error'
                    );
                }
            } catch (err) {
                addCheck(
                    'Face-API.js Library Access Error',
                    err.message,
                    'error'
                );
            }
            
            // Check 4: Test loading models
            try {
                addCheck(
                    'Loading Models Test',
                    'Attempting to load models... (check console for details)',
                    'warning'
                );
                
                // We can't actually test loading without the library, but we can check if files are readable
                const testFile = await fetch('models/tiny_face_detector_model-weights_manifest.json');
                const data = await testFile.json();
                
                if (data && data.weightsManifest) {
                    addCheck(
                        'Model Files Readable',
                        'Model manifest files can be read and parsed correctly.',
                        'success'
                    );
                } else {
                    addCheck(
                        'Model Files Corrupted',
                        'Model manifest files exist but appear to be corrupted or invalid.',
                        'error'
                    );
                }
            } catch (err) {
                addCheck(
                    'Model Loading Test Failed',
                    `Error: ${err.message}<br><br>
                     <strong>Common fixes:</strong><br>
                     • Ensure XAMPP Apache is running<br>
                     • Check that models/ folder is in the correct directory<br>
                     • Verify file permissions<br>
                     • Try accessing <code>${window.location.origin}/models/</code> directly`,
                    'error'
                );
            }
            
            // Check 5: Browser compatibility
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                addCheck(
                    'Browser Camera API Support',
                    'Your browser supports the camera API required for face detection.',
                    'success'
                );
            } else {
                addCheck(
                    'Browser Camera API Not Supported',
                    'Your browser does not support getUserMedia. Please use Chrome, Firefox, or Edge.',
                    'error'
                );
            }
            
            // Check 6: HTTPS or localhost
            if (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                addCheck(
                    'Secure Context',
                    `Running on ${window.location.protocol}//${window.location.hostname} - Camera access should work.`,
                    'success'
                );
            } else {
                addCheck(
                    'Insecure Context Warning',
                    `Running on ${window.location.protocol}. Camera API requires HTTPS or localhost for security reasons.`,
                    'warning'
                );
            }
            
            // Summary
            if (allPassed) {
                summaryDiv.innerHTML = `
                    <div class="summary success">
                        ✅ All checks passed! Your system is ready for face recognition.
                    </div>
                `;
            } else {
                summaryDiv.innerHTML = `
                    <div class="summary error">
                        ❌ Some checks failed. Please fix the issues above before using the kiosk.
                    </div>
                `;
            }
        }
        
        // Run checks on page load
        runChecks();
    </script>
</body>
</html>
