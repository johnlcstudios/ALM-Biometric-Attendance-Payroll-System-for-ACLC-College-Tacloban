<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk System</title>

    <style>
        :root {
            --blue: #1e0178;
            --red: #db261f;
            --white: #f9f9f9;
            --bg: #eef1f6;
            --text: #222;
            --radius: 24px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        /* HEADER */
        .header {
            text-align: center;
            font-size: clamp(24px, 4vw, 40px);
            font-weight: bold;
            color: var(--blue);
            padding: 15px;
        }

        /* LAYOUT */
        .container {
            display: flex;
            flex-wrap: wrap;
            min-height: 90vh;
        }

        /* LEFT PANEL */
        .left {
            flex: 1 1 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .photo {
            width: clamp(220px, 35vw, 360px);
            height: clamp(220px, 35vw, 360px);
            border-radius: 50%;
            background: #ddd;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* RIGHT PANEL */
        .right {
            flex: 1 1 400px;
            background: var(--blue);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* CLOCK */
        .clock {
            font-size: clamp(32px, 5vw, 60px);
            font-weight: bold;
        }

        .date {
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* CARD */
        .card {
            background: var(--white);
            color: var(--text);
            border-radius: var(--radius);
            padding: 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        /* TITLE */
        .title {
            background: var(--blue);
            color: white;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* NAME */
        .name {
            margin-bottom: 20px;
        }

        .name strong {
            font-size: 18px;
        }

        /* STATS */
        .stats {
            display: flex;
            gap: 10px;
        }

        .stat {
            flex: 1;
            background: #f0f2f8;
            padding: 15px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .stat:hover {
            transform: translateY(-3px);
        }

        .stat h4 {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat p {
            font-size: 26px;
            font-weight: bold;
            color: var(--blue);
        }

        /* BUTTONS */
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-danger {
            background: var(--red);
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        /* FOOTER */
        .footer {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .stats {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="header">KIOSK SYSTEM</div>

    <div class="container">

        <!-- LEFT -->
        <div class="left">
            <div class="photo" id="photoPreview">
                <span>No Image</span>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="right">

            <div class="clock" id="clock"></div>
            <div class="date" id="date"></div>

            <div class="card">

                <div class="title">EMPLOYEE SUMMARY</div>

                <div class="name">
                    <strong id="empName">Waiting for Scan...</strong><br>
                    <span id="empRole">---</span>
                </div>

                <div class="stats">
                    <div class="stat">
                        <h4>Attendances</h4>
                        <p id="att">00</p>
                    </div>
                    <div class="stat">
                        <h4>Absences</h4>
                        <p id="abs">00</p>
                    </div>
                    <div class="stat">
                        <h4>Loans</h4>
                        <p id="loan">00</p>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn-primary" onclick="timeIn()">Time In</button>
                    <button class="btn-danger" onclick="timeOut()">Time Out</button>
                </div>

            </div>

            <div class="footer">Developed By: BSIT-3A (2027)</div>

        </div>

    </div>

    <script>
        /* STATE */
        let state = {
            employee: null
        };

        /* CLOCK + DATE */
        function updateDateTime() {
            const now = new Date();

            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            document.getElementById("clock").textContent = time;
            document.getElementById("date").textContent = date;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        /* RENDER */
        function render() {
            if (!state.employee) return;

            empName.textContent = state.employee.name;
            empRole.textContent = state.employee.role;
            att.textContent = state.employee.attendance;
            abs.textContent = state.employee.absences;
            loan.textContent = state.employee.loans;

            if (state.employee.photo) {
                photoPreview.innerHTML = `<img src="${state.employee.photo}">`;
            }
        }

        /* API (READY FOR BACKEND) */
        async function fetchEmployee(id) {
            // Replace with real API
            return {
                id,
                name: "Arianne Smith",
                role: "School Dean",
                attendance: 12,
                absences: 2,
                loans: 1,
                photo: "https://via.placeholder.com/300"
            };
        }

        /* LOAD EMPLOYEE */
        async function loadEmployee(id) {
            state.employee = await fetchEmployee(id);
            render();
        }

        /* ACTIONS */
        function timeIn() {
            if (!state.employee) return alert("No employee loaded");

            console.log("Time In:", state.employee.id);

            // Example backend call:
            // fetch('/api/time-in', { method:'POST', body: JSON.stringify({id: state.employee.id}) })
        }

        function timeOut() {
            if (!state.employee) return alert("No employee loaded");

            console.log("Time Out:", state.employee.id);
        }

        /* SIMULATE SCAN */
        setTimeout(() => {
            loadEmployee(1);
        }, 1000);

    </script>

</body>

</html>
